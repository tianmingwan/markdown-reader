[package]
name = "mdreader"
version = "0.2.1"
description = "markdown阅读器"
authors = ["mdreader"]
edition = "2021"

[lib]
name = "mdreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.6"
base64 = "0.22"
percent-encoding = "2"
tokio = { version = "1", features = ["sync"] }
mdreader-core = { path = "core" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
