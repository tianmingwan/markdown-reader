name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      # 打 tag 时需要写权限创建 GitHub Release
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 覆盖 .cargo/config.toml 里 Windows 专用的 target-dir，保证缓存命中默认路径
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - name: build Tauri app (deb + AppImage)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 覆盖 .cargo/config.toml 的 target-dir = "C:/mdrtarget"（Windows 专用，Linux 下无效）
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        with:
          # 仅推送 v* 标签时创建 GitHub Release（__VERSION__ 自动替换为 tauri.conf.json 的 version，如 v0.1.0）
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'MarkdownReader v__VERSION__' || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/v') && '自动构建产物：\n- Ubuntu (.deb 安装包)\n- Linux (.AppImage 免安装)' || '' }}
          releaseDraft: false
          prerelease: false

      - name: upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
