name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - name: build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'MarkdownReader v__VERSION__' || '' }}
          releaseBody: "自动构建产物：\n- Windows (.exe 安装包)\n- Ubuntu (.deb 安装包)\n- Linux (.AppImage 免安装)\n- Android (.apk 安装包)"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: upload deb
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: upload AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install cargo-ndk
        run: cargo install cargo-ndk

      - name: install frontend dependencies
        run: npm ci

      - name: init Tauri Android
        run: npm run tauri android init -- --ci

      - name: configure Android files and dependencies
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/java/com/chensdong/mdreader
          cp src-tauri/android-extras/SafPlugin.kt src-tauri/gen/android/app/src/main/java/com/chensdong/mdreader/
          cp src-tauri/android-extras/MainActivity.kt src-tauri/gen/android/app/src/main/java/com/chensdong/mdreader/
          node -e '
            const fs = require("fs");
            const file = "src-tauri/gen/android/app/build.gradle.kts";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (!content.includes("activity-ktx")) {
                content = content.replace("dependencies {", `dependencies {\n    implementation("androidx.activity:activity-ktx:1.10.1")\n    implementation("androidx.lifecycle:lifecycle-process:2.10.0")`);
                fs.writeFileSync(file, content);
              }
            }
          '

      - name: build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri android build -- --apk --debug

      - name: prepare APK artifact
        run: |
          mkdir -p apk-output
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f -exec cp {} apk-output/ \;

      - name: upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk-output/*.apk
          if-no-files-found: error

  release-android:
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk-dist

      - name: upload APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in apk-dist/*.apk; do
            [ -f "$f" ] || continue
            cp "$f" "apk-dist/MarkdownReader-${{ github.ref_name }}-android-debug.apk"
            break
          done
          gh release upload ${{ github.ref_name }} apk-dist/*.apk --clobber

